<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Shield Gradients -->
    <linearGradient id="shieldOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#05267A" />
    </linearGradient>

    <linearGradient id="shieldBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="45%" stop-color="#0055D4" />
      <stop offset="100%" stop-color="#05246D" />
    </linearGradient>

    <linearGradient id="shieldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </linearGradient>

    <!-- Swoosh Orbit Gradient (Cyan to Emerald) -->
    <linearGradient id="orbitSwoosh" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="40%" stop-color="#00C9FF" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Red Circle Glow -->
    <linearGradient id="redBadgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
    <filter id="shieldShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#041E42" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ================= EMBLEM SECTION (Y: 40 to 330, Center X: 300) ================= -->

  <!-- BEHIND-THE-SHIELD ORBIT BACK ARC -->
  <path d="M 175 290 C 130 260 160 210 210 185" 
        fill="none" stroke="url(#orbitSwoosh)" stroke-width="14" stroke-linecap="round" opacity="0.4" />

  <!-- MAIN SHIELD LAYER 1: OUTER BORDER -->
  <path d="M 300 65 
           C 345 65 410 88 425 145 
           C 425 240 300 325 300 325 
           C 300 325 175 240 175 145 
           C 190 88 255 65 300 65 Z" 
        fill="url(#shieldOuterRim)" filter="url(#shieldShadow)" />

  <!-- MAIN SHIELD LAYER 2: INNER VIBRANT BODY -->
  <path d="M 300 78 
           C 338 78 395 98 408 148 
           C 408 230 300 305 300 305 
           C 300 305 192 230 192 148 
           C 205 98 262 78 300 78 Z" 
        fill="url(#shieldBodyGrad)" />

  <!-- MAIN SHIELD LAYER 3: 3D FACET LEFT HIGHLIGHT -->
  <path d="M 300 78 
           C 262 78 205 98 192 148 
           C 192 230 300 305 300 305 
           L 300 78 Z" 
        fill="url(#shieldHighlight)" />

  <!-- INNER SHIELD ACCENT RIM -->
  <path d="M 300 95 
           C 330 95 378 112 388 152 
           C 388 218 300 280 300 280 
           C 300 280 212 218 212 152 
           C 222 112 270 95 300 95 Z" 
        fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.6" />

  <!-- WHITE GLOSSY PADLOCK IN CENTER -->
  <g transform="translate(300, 195)">
    <!-- Shackle -->
    <path d="M -26 -12 
             L -26 -34 
             C -26 -52 26 -52 26 -34 
             L 26 -12" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lock Body -->
    <rect x="-40" y="-14" width="80" height="66" rx="14" fill="#FFFFFF" filter="url(#badgeShadow)" />
    <!-- Keyhole -->
    <circle cx="0" cy="12" r="7.5" fill="#0055D4" />
    <path d="M -3.5 14 L 3.5 14 L 5.5 32 L -5.5 32 Z" fill="#0055D4" />
  </g>

  <!-- FOREGROUND DYNAMIC SWOOSH (CYAN-EMERALD ORBIT) -->
  <path d="M 145 295 
           C 170 330 250 325 345 270 
           C 425 225 475 160 500 135 
           C 510 125 480 155 420 205 
           C 330 275 220 310 145 295 Z" 
        fill="url(#orbitSwoosh)" filter="url(#badgeShadow)" />

  <!-- ================= 4 PROHIBITION SCAM WARNING BADGES ================= -->

  <!-- 1. TOP-LEFT: MOBILE PHONE WITH "OTP ***" -->
  <g transform="translate(145, 125)" filter="url(#badgeShadow)">
    <!-- Base dark circle -->
    <circle cx="0" cy="0" r="42" fill="#0A1E4A" />
    <!-- Phone silhouette -->
    <rect x="-18" y="-28" width="36" height="54" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <rect x="-14" y="-20" width="28" height="36" rx="3" fill="#F8FAFC" />
    <text x="0" y="-7" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#0F172A" text-anchor="middle">OTP</text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#EF4444" text-anchor="middle">***</text>
    <!-- Outer Red Prohibition Ring & Slash -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#redBadgeRing)" stroke-width="7" />
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="url(#redBadgeRing)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- 2. BOTTOM-LEFT: PHISHING EMAIL -->
  <g transform="translate(105, 245)" filter="url(#badgeShadow)">
    <circle cx="0" cy="0" r="40" fill="#0A1E4A" />
    <!-- Envelope -->
    <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#FFFFFF" />
    <path d="M -20 -14 L 0 3 L 20 -14" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linejoin="round" />
    <!-- Outer Red Prohibition Ring & Slash -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#redBadgeRing)" stroke-width="6.5" />
    <line x1="-26" y1="-26" x2="26" y2="26" stroke="url(#redBadgeRing)" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- 3. TOP-RIGHT: DANGEROUS LINK -->
  <g transform="translate(435, 110)" filter="url(#badgeShadow)">
    <circle cx="0" cy="0" r="40" fill="#0A1E4A" />
    <!-- Chain Link Icon -->
    <g transform="rotate(45)">
      <rect x="-14" y="-7" width="28" height="14" rx="7" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
      <rect x="-4" y="-7" width="28" height="14" rx="7" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
    </g>
    <!-- Outer Red Prohibition Ring & Slash -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#redBadgeRing)" stroke-width="6.5" />
    <line x1="-26" y1="-26" x2="26" y2="26" stroke="url(#redBadgeRing)" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- 4. BOTTOM-RIGHT: HOODED HACKER / SCAMMER -->
  <g transform="translate(495, 255)" filter="url(#badgeShadow)">
    <circle cx="0" cy="0" r="40" fill="#0A1E4A" />
    <!-- Hooded Silhouette -->
    <path d="M 0 -22 C -15 -22 -22 -6 -22 8 L 22 8 C 22 -6 15 -22 0 -22 Z" fill="#F8FAFC" />
    <path d="M 0 -17 C -10 -17 -15 -5 -15 6 L 15 6 C 15 -5 10 -17 0 -17 Z" fill="#0F172A" />
    <!-- Glowing Visor / Mask Eyes -->
    <path d="M -8 -1 L -2 -1 M 2 -1 L 8 -1" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Outer Red Prohibition Ring & Slash -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#redBadgeRing)" stroke-width="6.5" />
    <line x1="-26" y1="-26" x2="26" y2="26" stroke="url(#redBadgeRing)" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING (Y: 360 to 540) ================= -->

  <!-- "ScamShield" Wordmark -->
  <g transform="translate(300, 440)" text-anchor="middle">
    <text font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
      <tspan fill="#0A1E4A">Scam</tspan>
      <tspan fill="#0066FF">Sh</tspan>
      <tspan fill="#0066FF">ield</tspan>
    </text>
    <!-- Green Mini-Shield dot over the 'i' in Shield (placed at x: 80, y: -48) -->
    <path d="M 78 -56 
             C 83 -56 90 -52 92 -45 
             C 92 -36 78 -28 78 -28 
             C 78 -28 64 -36 64 -45 
             C 66 -52 73 -56 78 -56 Z" 
          fill="#10B981" />
    <!-- Tiny White Checkmark inside green mini-shield -->
    <path d="M 72 -43 L 76 -39 L 84 -48" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tagline: "— Stay Aware | Stay Safe —" -->
  <g transform="translate(300, 485)" text-anchor="middle">
    <!-- Left Divider Line -->
    <line x1="-240" y1="-6" x2="-195" y2="-6" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round" />
    <!-- Tagline Text -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="24" fill="#0A1E4A" letter-spacing="0.5">
      Stay Aware <tspan fill="#64748B" font-weight="400">|</tspan> Stay Safe
    </text>
    <!-- Right Divider Line -->
    <line x1="195" y1="-6" x2="240" y2="-6" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Sub-Tagline: "Your Shield Against Online Scams" -->
  <text x="300" y="530" 
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-weight="600" 
        font-size="19" 
        fill="#334155" 
        text-anchor="middle" 
        letter-spacing="0.5">
    Your Shield Against Online Scams
  </text>
</svg>
